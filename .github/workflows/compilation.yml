name: Weekly Golu compilation

on:
  schedule:
    - cron: '30 21 * * 6'   # every Sunday 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build and publish the compilation
        env:
          GH_TOKEN: ${{ github.token }}
          FOLDER_ID: 169NTC-6EJ1SZB0RFdy9pq6hVLXl4ICR3
        shell: python
        run: |
          import datetime, html, os, re, subprocess, urllib.request
          W, H = 1920, 1080
          def sh(*a):
              print('+', ' '.join(a), flush=True); subprocess.run(a, check=True)
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=180).read()
          page = get('https://drive.google.com/embeddedfolderview?id=' + os.environ['FOLDER_ID']).decode('utf-8', 'ignore')
          found = re.findall(r'id="entry-([\w-]+)".*?flip-entry-title">([^<]+)<', page, re.S)
          eps = sorted((html.unescape(t), i) for i, t in found if re.match(r'Ep\d+', html.unescape(t)))
          print('episodes in folder:', [t for t, _ in eps])
          eps = eps[-14:]
          if len(eps) < 4:
              raise SystemExit('fewer than 4 episodes yet; skipping this week')
          y, w, _ = datetime.date.today().isocalendar()
          tag = f'comp-{y}-W{w:02d}'
          if subprocess.run(['gh', 'release', 'view', tag], capture_output=True).returncode == 0:
              raise SystemExit(f'{tag} already built')
          os.makedirs('work', exist_ok=True)
          parts = []
          for n, (title, fid) in enumerate(eps):
              src = f'work/src{n:02d}.mp4'
              open(src, 'wb').write(get(f'https://drive.google.com/uc?export=download&id={fid}'))
              if os.path.getsize(src) < 50000:
                  print('skip (bad download):', title); continue
              dst = f'work/part{n:02d}.mp4'
              vf = (f'[0:v]split[a][b];[a]scale={W}:{H}:force_original_aspect_ratio=increase,crop={W}:{H},'
                    f'boxblur=28:4,eq=brightness=-0.06:saturation=0.9[bg];[b]scale=-2:{H}:flags=lanczos[fg];'
                    f'[bg][fg]overlay=(W-w)/2:0,fps=30,format=yuv420p[v]')
              sh('ffmpeg', '-y', '-loglevel', 'error', '-i', src, '-filter_complex', vf, '-map', '[v]', '-map', '0:a',
                 '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '21', '-c:a', 'aac', '-ar', '48000', '-ac', '2', '-b:a', '160k', dst)
              parts.append(dst)
          with open('work/list.txt', 'w') as f:
              f.writelines(f"file '{os.path.abspath(p)}'\n" for p in parts)
          out = f'work/{tag}.mp4'
          sh('ffmpeg', '-y', '-loglevel', 'error', '-f', 'concat', '-safe', '0', '-i', 'work/list.txt', '-c', 'copy', '-movflags', '+faststart', out)
          names = '\n'.join(t for t, _ in eps)
          sh('gh', 'release', 'create', tag, out, '--title', f'Golu & Dost compilation {tag}', '--notes', f'Episodes:\n{names}')
