name: Free image generation (SDXL-Lightning on CPU)
# SDXL base 1.0 (CreativeML OpenRAIL++-M, commercial use allowed) + ByteDance SDXL-Lightning 4-step UNet (OpenRAIL++).
# Reads cpugen_req/job.json {"job":..,"width":1344,"height":768,"steps":4,"style":"..","negative":"..","images":[{"id","prompt","seed"}]}
# Splits the images over parallel shards. Results: branch "images" under cpu/<job>/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cpugen_req/**']
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: sdxl-lightning-v1 }
      - name: Generate
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", SHARD: "${{ matrix.shard }}", NSHARD: "4" }
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          pip install -q diffusers transformers accelerate safetensors huggingface_hub pillow
          python - <<'PY'
          import json, os, time, torch
          from diffusers import StableDiffusionXLPipeline, UNet2DConditionModel, EulerDiscreteScheduler
          from huggingface_hub import hf_hub_download
          from safetensors.torch import load_file
          job = json.load(open('cpugen_req/job.json'))
          mine = [im for i, im in enumerate(job['images']) if i % int(os.environ['NSHARD']) == int(os.environ['SHARD'])]
          out = f"/tmp/out/cpu/{job['job']}"; os.makedirs(out, exist_ok=True)
          if not mine: open(f"{out}/.empty{os.environ['SHARD']}", 'w').write(''); raise SystemExit
          base = 'stabilityai/stable-diffusion-xl-base-1.0'; steps = job.get('steps', 4)
          unet = UNet2DConditionModel.from_config(base, subfolder='unet')
          unet.load_state_dict(load_file(hf_hub_download('ByteDance/SDXL-Lightning', f'sdxl_lightning_{steps}step_unet.safetensors')))
          pipe = StableDiffusionXLPipeline.from_pretrained(base, unet=unet, torch_dtype=torch.float32)
          pipe.scheduler = EulerDiscreteScheduler.from_config(pipe.scheduler.config, timestep_spacing='trailing')
          torch.set_num_threads(os.cpu_count())
          log = []
          for im in mine:
              t = time.time()
              g = torch.Generator().manual_seed(im.get('seed', 1))
              img = pipe(prompt=job.get('style', '') + ' ' + im['prompt'], negative_prompt=job.get('negative'),
                         num_inference_steps=steps, guidance_scale=0, width=job.get('width', 1344), height=job.get('height', 768), generator=g).images[0]
              img.save(f"{out}/{im['id']}.png"); log.append(f"{im['id']}: ok {time.time()-t:.0f}s"); print(log[-1], flush=True)
          open(f"{out}/log{os.environ['SHARD']}.txt", 'w').write('\n'.join(log) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with: { name: "shard${{ matrix.shard }}", path: /tmp/out }
  save:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: /tmp/arts }
      - name: Commit to the images branch
        run: |
          git config user.name images-bot; git config user.email images-bot@users.noreply.github.com
          if git ls-remote --exit-code --heads origin images >/dev/null; then git switch -f images; else git switch --orphan images; fi
          mkdir -p cpu && for d in /tmp/arts/*/cpu; do cp -r $d/* cpu/; done
          git add cpu && git commit -m "CPU images" && git push origin images
