name: Drive poller (always-on)
# Scheduled Claude tasks can't push to GitHub, so they drop job files in the PUBLIC Drive folder instead:
#   tts_job_<id>.json     -> this poller dispatches tts.yml (which generates voices into branch "tts")
#   buffer_job_<id>.json  -> this poller posts via Buffer (video from Drive -> branch "media" raw URL) and writes
#                            the result to branch "buffer" at buffer/<id>/result.json
# Each run polls every 60 s for ~5h45m, then dispatches itself again (workflow_dispatch via GITHUB_TOKEN is allowed).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'   # safety net in case the chain ever breaks
permissions:
  contents: write
  actions: write
concurrency:
  group: poller
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FOLDER_ID: 169NTC-6EJ1SZB0RFdy9pq6hVLXl4ICR3
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Poll
        run: |
          pip install -q requests
          git config --global user.name poller-bot; git config --global user.email poller-bot@users.noreply.github.com
          python - <<'PY'
          import html, json, os, re, subprocess, time, urllib.request, requests, shutil
          FOLDER = os.environ['FOLDER_ID']; KEY = os.environ.get('BUFFER_API_KEY', '')
          def sh(*a, check=True): return subprocess.run(a, capture_output=True, text=True, check=check).stdout
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=180).read()
          def drive_files():
              page = get('https://drive.google.com/embeddedfolderview?id=' + FOLDER).decode('utf-8', 'ignore')
              return [(html.unescape(t), i) for i, t in re.findall(r'id="entry-([\w-]+)".*?flip-entry-title">([^<]+)<', page, re.S)]
          def drive_download(fid, path):
              s = requests.Session(); u = f'https://drive.google.com/uc?export=download&id={fid}'
              r = s.get(u, timeout=300)
              if 'text/html' in r.headers.get('content-type', ''):   # large-file confirm page
                  m = re.search(r'name="uuid" value="([^"]+)"', r.text); c = re.search(r'name="confirm" value="([^"]+)"', r.text)
                  r = s.get('https://drive.usercontent.google.com/download', params={'id': fid, 'export': 'download', 'confirm': c.group(1) if c else 't', 'uuid': m.group(1) if m else ''}, timeout=600)
              open(path, 'wb').write(r.content); return len(r.content)
          def branch_files(br):
              sh('git', 'fetch', '-q', 'origin', f'+{br}:refs/remotes/origin/{br}', check=False)
              return sh('git', 'ls-tree', '-r', '--name-only', f'origin/{br}', check=False)
          def push_files(br, files, msg):
              wt = f'/tmp/wt_{br}'; shutil.rmtree(wt, ignore_errors=True)
              exists = subprocess.run(['git', 'ls-remote', '--exit-code', '--heads', 'origin', br], capture_output=True).returncode == 0
              if exists: sh('git', 'worktree', 'add', '-f', wt, f'origin/{br}')
              else: sh('git', 'worktree', 'add', '--orphan', '-b', f'new_{br}', wt)
              for rel, src in files:
                  os.makedirs(os.path.dirname(f'{wt}/{rel}'), exist_ok=True); shutil.copy(src, f'{wt}/{rel}')
              sh('git', '-C', wt, 'add', '-A'); sh('git', '-C', wt, 'commit', '-qm', msg)
              for _ in range(4):
                  if subprocess.run(['git', '-C', wt, 'push', '-q', 'origin', f'HEAD:{br}']).returncode == 0: break
                  subprocess.run(['git', '-C', wt, 'pull', '-q', '--rebase', 'origin', br])
              sh('git', 'worktree', 'remove', '--force', wt)
          def gql(q, v):
              r = requests.post('https://api.buffer.com', json={'query': q, 'variables': v}, headers={'Authorization': 'Bearer ' + KEY}, timeout=120)
              try: return r.status_code, r.json()
              except Exception: return r.status_code, r.text[:1000]
          MUT = 'mutation($i: CreatePostInput!){ createPost(input:$i){ ... on PostActionSuccess { post { id dueAt status } } ... on MutationError { message } } }'
          def do_buffer(jid, fid):
              job = json.loads(get(f'https://drive.google.com/uc?export=download&id={fid}'))
              hosted, res = {}, []
              for p in job.get('posts', []):
                  url = p.get('video_url')
                  if p.get('drive_id'):
                      d = p['drive_id']
                      if d not in hosted:
                          name = p.get('media_name') or f'{jid}_{d[:8]}.mp4'
                          n = drive_download(d, f'/tmp/{name}')
                          push_files('media', [(f'media/{name}', f'/tmp/{name}')], f'media {name}')
                          hosted[d] = f"https://raw.githubusercontent.com/{os.environ['REPO']}/media/media/{name}"
                          print('hosted', name, n, flush=True)
                      url = hosted[d]
                  inp = {'channelId': p['channelId'], 'text': p.get('text', ''), 'schedulingType': 'automatic', 'needsApproval': False,
                         'assets': [{'video': {'url': url}}] if url else [], 'mode': 'customScheduled' if p.get('dueAt') else 'addToQueue'}
                  if p.get('dueAt'): inp['dueAt'] = p['dueAt']
                  inp.update(p.get('extra', {}))
                  res.append({'channelId': p['channelId'], 'dueAt': p.get('dueAt'), 'video_url': url, 'out': gql(MUT, {'i': inp})})
              out = {'job': jid, 'results': res}
              for q in job.get('queries', []): out.setdefault('raw', []).append(gql(q['query'], q.get('variables', {})))
              json.dump(out, open('/tmp/res.json', 'w'), ensure_ascii=False, indent=1)
              push_files('buffer', [(f'buffer/{jid}/result.json', '/tmp/res.json')], f'buffer result {jid}')
              print('buffer job done', jid, json.dumps(out, ensure_ascii=False)[:600], flush=True)
          t0 = time.time(); last_tts = set()
          while time.time() - t0 < 5.6 * 3600:
              try:
                  files = drive_files()
                  tts_done, buf_done = branch_files('tts'), branch_files('buffer')
                  tts_pending = {m.group(1) for t, _ in files for m in [re.match(r'tts_job_([\w-]+)\.json$', t)] if m and f'jobs/{m.group(1)}/done.txt' not in tts_done}
                  if tts_pending - last_tts:
                      print('dispatch tts for', tts_pending, flush=True)
                      subprocess.run(['gh', 'workflow', 'run', 'tts.yml', '--repo', os.environ['REPO'], '--ref', 'main'])
                      last_tts = set(tts_pending)
                  for t, fid in files:
                      m = re.match(r'buffer_job_([\w-]+)\.json$', t)
                      if m and f'buffer/{m.group(1)}/result.json' not in buf_done and KEY:
                          try: do_buffer(m.group(1), fid)
                          except Exception as e: print('buffer job failed', m.group(1), repr(e), flush=True)
              except Exception as e: print('poll error', repr(e), flush=True)
              time.sleep(60)
          PY
      - name: Chain the next run
        if: always()
        run: gh workflow run poller.yml --repo "$REPO" --ref main
