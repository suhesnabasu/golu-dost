name: Voice generation (TTS)

# Every 10 minutes: look in the public Drive folder for tts_job_<id>.json files.
# For each job not done yet, generate the voices and commit them to the "tts" branch
# under jobs/<id>/ so the automation can pick them up.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FOLDER_ID: 169NTC-6EJ1SZB0RFdy9pq6hVLXl4ICR3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find pending jobs
        id: find
        shell: python
        run: |
          import html, json, os, re, subprocess, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=120).read()
          page = get('https://drive.google.com/embeddedfolderview?id=' + os.environ['FOLDER_ID']).decode('utf-8', 'ignore')
          files = [(html.unescape(t), i) for i, t in re.findall(r'id="entry-([\w-]+)".*?flip-entry-title">([^<]+)<', page, re.S)]
          subprocess.run(['git', 'fetch', 'origin', 'tts'], capture_output=True)
          done = subprocess.run(['git', 'ls-tree', '-r', '--name-only', 'origin/tts'], capture_output=True, text=True).stdout
          pending = []
          os.makedirs('/tmp/jobs', exist_ok=True)
          for title, fid in files:
              m = re.match(r'tts_job_([\w-]+)\.json$', title)
              if not m or f'jobs/{m.group(1)}/done.txt' in done: continue
              open(f'/tmp/jobs/{m.group(1)}.json', 'wb').write(get(f'https://drive.google.com/uc?export=download&id={fid}'))
              pending.append(m.group(1))
          print('pending:', pending)
          engines = set()
          for j in pending:
              engines.add(json.load(open(f'/tmp/jobs/{j}.json')).get('engine', 'magpie'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"any={'yes' if pending else 'no'}\n")
              f.write(f"magpie={'yes' if 'magpie' in engines else 'no'}\n")

      - uses: actions/setup-python@v5
        if: steps.find.outputs.any == 'yes'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/tts.yml

      - name: Cache model weights
        if: steps.find.outputs.magpie == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-magpie-357m-v1

      - name: Install Magpie TTS (NVIDIA NeMo, CPU)
        if: steps.find.outputs.magpie == 'yes'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsndfile1 ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q "nemo_toolkit[tts] @ git+https://github.com/NVIDIA/NeMo.git@main" kaldialign soundfile

      - name: Install basics
        if: steps.find.outputs.any == 'yes'
        run: pip install -q soundfile numpy requests

      - name: Generate voices
        if: steps.find.outputs.any == 'yes'
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        shell: python
        run: |
          import glob, json, os, subprocess
          import numpy as np, soundfile as sf
          magpie = None
          SPK = {'Aria': 0, 'Jason': 1, 'John': 2, 'Leo': 3, 'Sofia': 4}
          for path in sorted(glob.glob('/tmp/jobs/*.json')):
              jid = os.path.basename(path)[:-5]
              job = json.load(open(path))
              eng = job.get('engine', 'magpie')
              if eng == 'fish' and not os.environ.get('FISH_API_KEY'):
                  print(jid, 'skipped: add the FISH_API_KEY secret first', flush=True); continue
              out = f'/tmp/out/{jid}'; os.makedirs(out, exist_ok=True)
              log = []
              for ln in job['lines']:
                  wav = f"{out}/{ln['id']}.wav"
                  try:
                      if eng == 'magpie':
                          if magpie is None:
                              from nemo.collections.tts.models import MagpieTTSModel
                              magpie = MagpieTTSModel.from_pretrained('nvidia/magpie_tts_multilingual_357m').eval()
                          import torch
                          with torch.no_grad():
                              audio, alen = magpie.do_tts(ln['text'], language=ln.get('lang', 'hi'), apply_TN=False,
                                                          speaker_index=SPK[ln.get('speaker', 'Leo')])
                          a = audio[0][: int(alen[0])].float().cpu().numpy()
                          sf.write(wav, a, int(getattr(magpie, 'sample_rate', 22050)))
                      elif eng == 'fish':
                          import requests
                          body = {'text': ln['text'], 'format': 'wav'}
                          if ln.get('voice'): body['reference_id'] = ln['voice']
                          r = requests.post('https://api.fish.audio/v1/tts', json=body, timeout=300,
                                            headers={'Authorization': 'Bearer ' + os.environ['FISH_API_KEY'],
                                                     'model': job.get('model', 'drama-3')})
                          r.raise_for_status(); open(wav, 'wb').write(r.content)
                      log.append(f"ok {ln['id']}")
                  except Exception as e:
                      log.append(f"FAIL {ln['id']}: {e!r}"); print(log[-1], flush=True)
              open(f'{out}/done.txt', 'w').write('\n'.join(log) + '\n')
              print(jid, log, flush=True)

      - name: Save to the tts branch
        if: steps.find.outputs.any == 'yes'
        run: |
          git config user.name tts-bot
          git config user.email tts-bot@users.noreply.github.com
          if git ls-remote --exit-code --heads origin tts >/dev/null; then
            git switch -f tts
          else
            git switch --orphan tts
          fi
          mkdir -p jobs
          cp -r /tmp/out/* jobs/
          git add jobs
          git commit -m "Voices for $(ls /tmp/out | tr '\n' ' ')"
          git push origin tts
