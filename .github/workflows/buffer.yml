name: Buffer API
# Uses secret BUFFER_API_KEY. Reads buffer_req/job.json:
#   {"job": "...", "action": "probe"}  -> lists organizations + channels + introspects createPost input types
#   {"job": "...", "action": "post", "posts": [ {"channelId":..., "text":..., "dueAt": ISO-UTC, "video_url":..., "extra": {...raw input fields...}} ]}
# Results (no secrets) go to branch "buffer" under buffer/<job>/result.json
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['buffer_req/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Call Buffer
        env: { BUFFER_API_KEY: "${{ secrets.BUFFER_API_KEY }}" }
        run: |
          pip install -q requests
          python - <<'PY'
          import json, os, requests
          job = json.load(open('buffer_req/job.json')); out = {"job": job["job"]}
          key = os.environ.get("BUFFER_API_KEY", "")
          out["key_present"] = bool(key)
          def gql(q, v=None):
              r = requests.post("https://api.buffer.com", json={"query": q, "variables": v or {}},
                                headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"}, timeout=120)
              try: return r.status_code, r.json()
              except Exception: return r.status_code, r.text[:2000]
          if key:
              if job["action"] == "probe":
                  out["orgs"] = gql("query { account { id email organizations { id name } } }")
                  try:
                      orgs = out["orgs"][1]["data"]["account"]["organizations"]
                      out["channels"] = [gql('query($o: OrganizationId!){ channels(input:{organizationId:$o}){ id name service } }', {"o": o["id"]}) for o in orgs]
                  except Exception as e: out["channels_err"] = repr(e)
                  types = {}
                  for t in job.get("types", ["CreatePostInput", "PostInputMetaData"]):
                      types[t] = gql('query($n:String!){ __type(name:$n){ name kind inputFields{ name type{ name kind ofType{ name kind ofType{ name kind ofType{ name kind } } } } } enumValues{ name } } }', {"n": t})
                  out["types"] = types
                  out["mutations"] = gql('{ __schema { mutationType { fields { name args { name type { name kind ofType { name } } } } } } }')
              elif job["action"] == "post":
                  res = []
                  for p in job["posts"]:
                      inp = {"channelId": p["channelId"], "text": p.get("text", ""), "schedulingType": "automatic", "needsApproval": False, "assets": []}
                      if p.get("dueAt"): inp.update({"mode": "customScheduled", "dueAt": p["dueAt"]})
                      else: inp["mode"] = "addToQueue"
                      if p.get("video_url"): inp["assets"] = [{"video": {"url": p["video_url"]}}]
                      inp.update(p.get("extra", {}))
                      q = "mutation($i: CreatePostInput!){ createPost(input:$i){ ... on PostActionSuccess { post { id dueAt status } } ... on MutationError { message } } }"
                      res.append({"in": {k: v for k, v in inp.items() if k != "text"}, "out": gql(q, {"i": inp})})
                  out["results"] = res
          os.makedirs(f"/tmp/out/buffer/{job['job']}", exist_ok=True)
          json.dump(out, open(f"/tmp/out/buffer/{job['job']}/result.json", "w"), indent=1, ensure_ascii=False)
          print(json.dumps(out, indent=1, ensure_ascii=False)[:6000])
          PY
      - name: Save result
        run: |
          git config user.name buffer-bot; git config user.email buffer-bot@users.noreply.github.com
          if git ls-remote --exit-code --heads origin buffer >/dev/null; then git switch -f buffer; else git switch --orphan buffer; fi
          mkdir -p buffer && cp -r /tmp/out/buffer/* buffer/ && git add buffer && git commit -m "Buffer result" && git push origin buffer
