name: Daily sync from Drive

on:
  schedule:
    - cron: '30 23 * * *'   # every day 05:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Copy code and videos from the public Drive folder
        env:
          GH_TOKEN: ${{ github.token }}
          FOLDER_ID: 169NTC-6EJ1SZB0RFdy9pq6hVLXl4ICR3
        shell: python
        run: |
          import html, os, re, shutil, subprocess, tarfile, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=180).read()
          def sh(*a, check=True):
              print('+', ' '.join(a), flush=True); return subprocess.run(a, check=check)
          page = get('https://drive.google.com/embeddedfolderview?id=' + os.environ['FOLDER_ID']).decode('utf-8', 'ignore')
          files = [(html.unescape(t), i) for i, t in re.findall(r'id="entry-([\w-]+)".*?flip-entry-title">([^<]+)<', page, re.S)]
          print('files:', [t for t, _ in files])
          os.makedirs('tmp', exist_ok=True)
          def fetch(fid, path):
              open(path, 'wb').write(get(f'https://drive.google.com/uc?export=download&id={fid}'))
          # 1) production code -> pipeline/
          code = [f for f in files if f[0] == 'golu_pipeline.tar.gz']
          if code:
              fetch(code[-1][1], 'tmp/p.tgz')
              shutil.rmtree('pipeline', ignore_errors=True)
              with tarfile.open('tmp/p.tgz') as t: t.extractall('tmp/p')
              shutil.copytree('tmp/p/golu_pipeline', 'pipeline')
          # 2) each episode's source -> episodes/EpNNN_name/
          for title, fid in files:
              m = re.match(r'src_(Ep\d+_[\w-]+)\.tar\.gz$', title)
              if not m or os.path.isdir(f'episodes/{m.group(1)}'): continue
              fetch(fid, 'tmp/e.tgz')
              with tarfile.open('tmp/e.tgz') as t: t.extractall('tmp/e')
              os.makedirs('episodes', exist_ok=True)
              src = [d for d in os.listdir('tmp/e')][0]
              shutil.copytree(f'tmp/e/{src}', f'episodes/{m.group(1)}')
              shutil.rmtree('tmp/e')
          # 3) episode videos -> GitHub Release "episodes" (videos are too big for git history)
          if subprocess.run(['gh', 'release', 'view', 'episodes'], capture_output=True).returncode != 0:
              sh('gh', 'release', 'create', 'episodes', '--title', 'Golu & Dost episodes', '--notes', 'All episode videos (720p).')
          have = subprocess.run(['gh', 'release', 'view', 'episodes', '--json', 'assets', '-q', '.assets[].name'],
                                capture_output=True, text=True).stdout.split()
          for title, fid in files:
              if re.match(r'Ep\d+_.*\.mp4$', title) and title not in have:
                  fetch(fid, f'tmp/{title}')
                  sh('gh', 'release', 'upload', 'episodes', f'tmp/{title}')
          shutil.rmtree('tmp')
          sh('git', 'config', 'user.name', 'golu-bot'); sh('git', 'config', 'user.email', 'golu-bot@users.noreply.github.com')
          sh('git', 'add', '-A')
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode != 0:
              sh('git', 'commit', '-m', 'Daily sync: pipeline code and episode sources from Drive')
              sh('git', 'push')
