name: Generate images (Gemini or Hugging Face)

# Reads imagegen_req/job.json and generates each image with the Hugging Face Inference API
# (secret HF_TOKEN). Results go to the "images" branch under images/<job>/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['imagegen_req/**']

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          pip install -q "huggingface_hub>=0.34" "google-genai>=1.30" pillow
          python - <<'PY'
          import json, os, time
          from huggingface_hub import InferenceClient
          job = json.load(open('imagegen_req/job.json'))
          out = f"/tmp/out/images/{job['job']}"; os.makedirs(out, exist_ok=True)
          model = job.get('model', 'black-forest-labs/FLUX.1-schnell')
          providers = job.get('providers', ['auto', 'fal-ai', 'together', 'nebius', 'replicate'])
          log = []
          gem_models = job.get('gemini_models', ['gemini-2.5-flash-image', 'gemini-2.5-flash-image-preview', 'imagen-4.0-generate-001'])
          def gemini(im):
              from google import genai
              from google.genai import types
              from io import BytesIO
              from PIL import Image
              c = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
              for m in gem_models:
                  try:
                      if m.startswith('imagen'):
                          r = c.models.generate_images(model=m, prompt=im['prompt'],
                                config=types.GenerateImagesConfig(number_of_images=1, aspect_ratio=job.get('aspect', '9:16')))
                          r.generated_images[0].image.save(f"{out}/{im['id']}.png")
                      else:
                          try:
                              cfg = types.GenerateContentConfig(response_modalities=['IMAGE'],
                                    image_config=types.ImageConfig(aspect_ratio=job.get('aspect', '9:16')))
                          except Exception:
                              cfg = types.GenerateContentConfig(response_modalities=['TEXT', 'IMAGE'])
                          r = c.models.generate_content(model=m, contents=im['prompt'], config=cfg)
                          parts = [p for p in r.candidates[0].content.parts if getattr(p, 'inline_data', None)]
                          if not parts: raise RuntimeError('no image in response')
                          Image.open(BytesIO(parts[0].inline_data.data)).save(f"{out}/{im['id']}.png")
                      log.append(f"{im['id']}: ok via gemini/{m}"); return True
                  except Exception as e:
                      log.append(f"{im['id']} gemini/{m}: {str(e)[:300]}")
              return False
          def pollinations(im):
              import urllib.request, urllib.parse
              for attempt in range(3):
                  try:
                      q = urllib.parse.urlencode({'width': job.get('width', 768), 'height': job.get('height', 1344),
                            'seed': im.get('seed', 1), 'model': 'flux', 'nologo': 'true', 'private': 'true'})
                      url = 'https://image.pollinations.ai/prompt/' + urllib.parse.quote(im['prompt']) + '?' + q
                      data = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'golu-dost'}), timeout=180).read()
                      if len(data) < 5000: raise RuntimeError(data[:200])
                      open(f"{out}/{im['id']}.png", 'wb').write(data)
                      log.append(f"{im['id']}: ok via pollinations/flux"); return True
                  except Exception as e:
                      log.append(f"{im['id']} pollinations try {attempt}: {str(e)[:300]}"); time.sleep(20)
              return False
          for im in job['images']:
              ok = False
              if job.get('provider') == 'pollinations':
                  ok = pollinations(im)
                  if ok: continue
              if job.get('provider') == 'gemini' or (os.environ.get('GEMINI_API_KEY') and job.get('provider') != 'hf'):
                  ok = gemini(im)
              for prov in ([] if ok else providers):
                  try:
                      c = InferenceClient(provider=prov, api_key=os.environ.get('HF_TOKEN',''))
                      img = c.text_to_image(im['prompt'], model=model, width=job.get('width', 768), height=job.get('height', 1344),
                                            num_inference_steps=job.get('steps', 4), seed=im.get('seed'))
                      img.save(f"{out}/{im['id']}.png"); ok = True; log.append(f"{im['id']}: ok via {prov}"); break
                  except Exception as e:
                      log.append(f"{im['id']} {prov}: {str(e)[:300]}")
              if not ok: log.append(f"{im['id']}: FAILED")
          open(f'{out}/log.txt', 'w').write('\n'.join(log) + '\n'); print('\n'.join(log))
          PY
      - name: Commit to the images branch
        run: |
          git config user.name images-bot; git config user.email images-bot@users.noreply.github.com
          if git ls-remote --exit-code --heads origin images >/dev/null; then git switch -f images; else git switch --orphan images; fi
          mkdir -p images && cp -r /tmp/out/images/* images/
          git add images && git commit -m "Images $(ls /tmp/out/images)" && git push origin images
