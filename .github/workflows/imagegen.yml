name: Generate images (FLUX.1-schnell, Apache-2.0)

# Reads imagegen_req/job.json and generates each image with the Hugging Face Inference API
# (secret HF_TOKEN). Results go to the "images" branch under images/<job>/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['imagegen_req/**']

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          pip install -q "huggingface_hub>=0.34" pillow
          python - <<'PY'
          import json, os, time
          from huggingface_hub import InferenceClient
          job = json.load(open('imagegen_req/job.json'))
          out = f"/tmp/out/images/{job['job']}"; os.makedirs(out, exist_ok=True)
          model = job.get('model', 'black-forest-labs/FLUX.1-schnell')
          providers = job.get('providers', ['auto', 'fal-ai', 'together', 'nebius', 'replicate'])
          log = []
          for im in job['images']:
              ok = False
              for prov in providers:
                  try:
                      c = InferenceClient(provider=prov, api_key=os.environ['HF_TOKEN'])
                      img = c.text_to_image(im['prompt'], model=model, width=job.get('width', 768), height=job.get('height', 1344),
                                            num_inference_steps=job.get('steps', 4), seed=im.get('seed'))
                      img.save(f"{out}/{im['id']}.png"); ok = True; log.append(f"{im['id']}: ok via {prov}"); break
                  except Exception as e:
                      log.append(f"{im['id']} {prov}: {str(e)[:300]}")
              if not ok: log.append(f"{im['id']}: FAILED")
          open(f'{out}/log.txt', 'w').write('\n'.join(log) + '\n'); print('\n'.join(log))
          PY
      - name: Commit to the images branch
        run: |
          git config user.name images-bot; git config user.email images-bot@users.noreply.github.com
          if git ls-remote --exit-code --heads origin images >/dev/null; then git switch -f images; else git switch --orphan images; fi
          mkdir -p images && cp -r /tmp/out/images/* images/
          git add images && git commit -m "Images $(ls /tmp/out/images)" && git push origin images
